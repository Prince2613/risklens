{% extends "base.html" %}
{% block title %}Login — RiskLens{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h2>Welcome back</h2>
      <p class="muted">Sign in to access your risk dashboard.</p>
    </div>

    <form method="POST" class="auth-form">
      <label>
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email">
      </label>

      <label>
        <span>Password</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>

      <button type="submit" class="btn-primary btn-full">Login</button>
    </form>

    <div class="auth-foot">
      New here? <a href="/signup">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
